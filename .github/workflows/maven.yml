name: Java CI

on:
  push:
    branches:
      - main
      - dev
      - feature/**

  pull_request:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Permissão Maven Wrapper
        run: chmod +x mvnw

      - name: Build do projeto
        run: ./mvnw -B clean package -DskipTests

  tests:

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Permissão Maven Wrapper
        run: chmod +x mvnw

      - name: Rodar testes
        run: ./mvnw -B test